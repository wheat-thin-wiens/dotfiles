# Default monitor
monitor=,1920x1080@165,auto,1


# Apps to be executed on launch
exec-once = waybar
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 & udiskie
exec-once = tmux setenv -g HYPRLAND_INSTANCE_SIGNATURE "$HYPRLAND_INSTANCE_SIGNATURE"

exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Static Wallpaper
exec-once = hyprpaper

# Animated Wallpaper
# exec-once = swww-daemon
# exec-once = swww img /home/ewiens/dotfiles/backgrounds/animated/eveninglights.gif

# Extra files
source = ~/.config/hypr/binds.conf

# NVIDIA settings
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
cursor {
  no_hardware_cursors = true
}

# hyprcursor
env = HYPRCURSOR_THEME,Posy_Cursor_Black
env = HYPRCUROSR_SIZE,24

# Screen sharing
windowrule {
  name = xwayland-video-bridge-fixes
  match:class = xwaylandvideobridge

  no_initial_focus = true
  no_focus = true
  no_anim = true
  no_blur = true
  max_size = 1 1
  opacity = 0
}
# windowrule = opacity 0.0 override, class:^(xwaylandvideobridge)$
# windowrule = noanim, class:^(xwaylandvideobridge)$
# windowrule = noinitialfocus, class:^(xwaylandvideobridge)$
# windowrule = maxsize 1 1, class:^(xwaylandvideobridge)$
# windowrule = noblur, class:^(xwaylandvideobridge)$
# windowrule = nofocus, class:^(xwaylandvideobridge)$

# Settings related to input devs
input {
    kb_layout = us
    repeat_rate = 45
    repeat_delay = 400
    follow_mouse = 1

    touchpad {
        natural_scroll = true
    }

    sensitivity = 0
}

general {
    gaps_in = 5
    gaps_out = 6
    border_size = 2
    col.active_border = rgb(d1d5db) 45deg # Takes two colors as an argument if you want a gradient
    col.inactive_border = rgba(121212cc)

    layout = master
}

decoration {
    rounding = 4

    blur {
        enabled = true
        size = 9
        passes = 3
        ignore_opacity = true
    }

    shadow {
        enabled = true
        range = 10
    }

    active_opacity = 1
    inactive_opacity = 0.9
}

animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 5, myBezier
    animation = windowsIn, 1, 5, myBezier, slide
    animation = windowsOut, 1, 5, default, slide
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 3, default, slidefade 20%
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# master {
#     new_is_master = true
# }

misc {
    animate_mouse_windowdragging = true
    disable_hyprland_logo = true
    disable_splash_rendering = true
    enable_swallow = true
    # render_ahead_safezone = 3
}

# windowrulev2=fakefullscreen, class:^(code-url-handler)$

