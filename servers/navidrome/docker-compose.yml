services:
  navidrome:
    image: deluan/navidrome:latest
    ports:
      - "4533:4533"
    environment:
      # Optional: put your config options customization here. Examples:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info  
    volumes:
      - "/home/ewiens/dotfiles/servers/navidrome/data:/data"
      - "/media/2TB/Music:/music:ro"
